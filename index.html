<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slatyfish 的小站</title>
    <style>
        /* 1. 针对整个网页身体的设置 */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* 换个稍微好看点的字体 */
            margin: 0;
            padding: 20px;
            min-height: 100vh; /* 确保高度至少占满一屏 */

            /* --- 核心：背景图片设置 --- */
            /* 【重要】把这里的路径换成你实际上传图片的路径 */
            background-image: url('images/background2.png');

            /* 让图片始终覆盖整个屏幕，可能会裁切掉边缘，但不会变形 */
            background-size: cover;
            /* 图片始终居中显示 */
            background-position: center center;
            /* 【可选】背景固定：滚动页面时，背景图不动，有一种高级感。如果不喜欢可以删掉这行 */
            background-attachment: fixed;
            /* 防止图片太小时像瓷砖一样重复平铺 */
            background-repeat: no-repeat;
            /* 在图片加载出来之前显示的底色 */
            background-color: #f4f4f4;
        }

        /* 2. 针对内容卡片的设置 */
        /* 把 header 和 article-card 的通用样式合并写在这里 */
        .header, .article-card {
            /* 让内容区域居中，并且不要太宽，方便阅读 */
            max-width: 800px;
            margin: 0 auto 20px auto; /* 上右下左：下边距20px隔开卡片，左右自动居中 */
            padding: 30px;
            border-radius: 12px; /* 圆角稍微大一点 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* 加一点阴影增加立体感 */

            /* --- 核心：半透明背景 --- */
            /* 使用 rgba 颜色模式。前三个 255 是白色，最后一个 0.85 是透明度 */
            /* 透明度范围 0.0 (全透) 到 1.0 (不透)，可以自己调整 */
            background: rgba(255, 255, 255, 0.85);
            /* 针对深色背景图，给文字增加一点点阴影提高可读性（可选） */
            /* text-shadow: 0 1px 2px rgba(0,0,0,0.1); */
        }

        /* 专门针对标题区域微调一下 */
        .header {
            text-align: center; /* 标题居中 */
            margin-top: 40px; /* 距离顶部远一点 */
        }

        /* 让链接颜色好看点 */
        a {
            color: #0366d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>你好，我是 Slatyfish</h1>
        <p>这是我纯手工打造的个人网站，主要用来记录生活。</p>
    </div>

    <div class="article-card">
        <h2>我的第一篇日记</h2>
        <p>日期：2026-01-18</p>
        <p>这里写正文内容，比如今天天气不错，我决定放弃 Hexo，开始学习 HTML...</p>
    </div>

    <div class="article-card">
        <h2>关于 Deep Learning 的思考</h2>
        <p>日期：2026-01-17</p>
        <p>最近在研究点云匹配...</p>
        <a href="posts/article2.html">点击阅读全文</a> </div>

</body>
</html>
